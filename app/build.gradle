plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carassistant'
    compileSdk 34

    // ===== Release 签名配置（从 keystore.properties 读取） =====
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.carassistant"
        minSdk 26          // Android 8.0
        targetSdk 34
        // ===== 版本号方案（对齐规则）=====
        // versionCode 采用构建日期 YYYYMMDD（单调递增，保证升级兼容、防止版本回退）
        // versionName 采用语义化版本 x.y.z，与 versionCode 通过文档约定保持一致
        //   例：versionName "1.0.0" 对应 versionCode 20260802
        versionCode 20260802
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            // 启用 R8 代码混淆、压缩、优化（轻量加壳，防反编译）
            minifyEnabled true
            // 启用资源压缩，移除未使用的资源
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 使用 release 签名
            signingConfig signingConfigs.release
        }
    }

    // ===== AAB（Android App Bundle）配置 =====
    // bundleRelease 会复用 buildTypes.release 的 minifyEnabled + signingConfig，
    // 因此产出的 .aab 同样经过 R8 混淆并已用 release keystore 签名。
    bundle {
        // 关闭语言拆分，所有语言资源打进同一个 AAB（如需按语言分发改为 true）
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Palette：从专辑封面提取主色调，实现动态主题色背景
    implementation 'androidx.palette:palette:1.0.0'
}
